<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="skyGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e0f2fe"/>
      <stop offset="60%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#ffffff"/>
    </linearGradient>
    <linearGradient id="glassFacade" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#cbd5e1" stop-opacity="0.8"/>
      <stop offset="50%" stop-color="#94a3b8" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#64748b" stop-opacity="0.7"/>
    </linearGradient>
    <linearGradient id="groundGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e2e8f0"/>
      <stop offset="100%" stop-color="#cbd5e1"/>
    </linearGradient>

    <!-- Car Gradients -->
    <linearGradient id="carBody" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="35%" stop-color="#0f172a"/>
      <stop offset="85%" stop-color="#020617"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="chromeGrille" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="30%" stop-color="#94a3b8"/>
      <stop offset="70%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#64748b"/>
    </linearGradient>
    <linearGradient id="windshield" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.4"/>
      <stop offset="50%" stop-color="#0f172a" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#020617" stop-opacity="0.95"/>
    </linearGradient>

    <!-- Indian Skin Tone Gradients -->
    <linearGradient id="skinTone" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#c68a5c"/>
      <stop offset="50%" stop-color="#b67a4d"/>
      <stop offset="100%" stop-color="#9a6238"/>
    </linearGradient>
    <linearGradient id="skinShadow" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9a6238"/>
      <stop offset="100%" stop-color="#7e4a23"/>
    </linearGradient>

    <!-- Uniform Gradients -->
    <linearGradient id="uniformDark" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1e2b44"/>
      <stop offset="50%" stop-color="#0f192d"/>
      <stop offset="100%" stop-color="#091020"/>
    </linearGradient>
    <linearGradient id="uniformHighlight" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2d3f63"/>
      <stop offset="100%" stop-color="#1e2b44"/>
    </linearGradient>
    <linearGradient id="goldAccent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="50%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <linearGradient id="badgeGlow" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>

    <!-- Drop Shadows -->
    <filter id="cardShadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#0f172a" flood-opacity="0.25"/>
    </filter>
    <filter id="badgeShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#059669" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Background Sky & Architecture -->
  <rect width="800" height="600" fill="url(#skyGrad)"/>

  <!-- Modern Tech Park Building Facade -->
  <g opacity="0.65">
    <rect x="0" y="40" width="360" height="420" fill="url(#glassFacade)"/>
    <!-- Glass mullions & window grids -->
    <path d="M 0 100 H 360 M 0 160 H 360 M 0 220 H 360 M 0 280 H 360 M 0 340 H 360 M 0 400 H 360" stroke="#ffffff" stroke-width="2" opacity="0.8"/>
    <path d="M 60 40 V 460 M 120 40 V 460 M 180 40 V 460 M 240 40 V 460 M 300 40 V 460" stroke="#ffffff" stroke-width="2" opacity="0.8"/>
    <!-- Architectural Entrance Canopy -->
    <polygon points="0,180 340,160 360,180 0,205" fill="#334155" opacity="0.9"/>
    <polygon points="0,205 360,180 360,192 0,217" fill="#1e293b"/>
  </g>

  <!-- Paved Corporate Driveway / Forecourt -->
  <polygon points="0,420 800,380 800,600 0,600" fill="url(#groundGrad)"/>
  <path d="M 0 460 L 800 420 M 0 510 L 800 470 M 0 560 L 800 520" stroke="#cbd5e1" stroke-width="1.5" opacity="0.7"/>

  <!-- ========================================================
       LUXURY EXECUTIVE CAR (Parked behind driver)
  ======================================================== -->
  <g transform="translate(180, 160)">
    <!-- Car Cast Shadow -->
    <ellipse cx="380" cy="310" rx="220" ry="25" fill="#0f172a" opacity="0.45"/>

    <!-- Car Main Chassis / Silhouette -->
    <path d="M 170 210 Q 240 140 330 135 L 470 138 Q 540 155 580 205 L 610 240 Q 615 270 590 280 L 160 280 Q 140 265 145 235 Z" fill="url(#carBody)"/>
    
    <!-- Windshield & Roof Glass -->
    <path d="M 270 142 L 350 140 L 460 142 Q 430 185 390 205 L 245 205 Q 255 170 270 142 Z" fill="url(#windshield)"/>
    <!-- Windshield Reflection Glare -->
    <path d="M 285 145 L 315 145 L 260 203 L 246 203 Z" fill="#ffffff" opacity="0.35"/>

    <!-- Car Hood & Front Fender -->
    <path d="M 460 195 L 585 205 Q 610 225 615 245 L 430 245 Z" fill="#090e17"/>
    <!-- Sleek Character Line Highlight -->
    <path d="M 180 225 Q 380 220 595 232" stroke="#64748b" stroke-width="2.5" fill="none" opacity="0.8"/>

    <!-- Premium Chrome Grille -->
    <rect x="520" y="222" width="75" height="42" rx="6" fill="url(#chromeGrille)"/>
    <path d="M 520 230 H 595 M 520 238 H 595 M 520 246 H 595 M 520 254 H 595" stroke="#1e293b" stroke-width="2"/>
    <line x1="557" y1="222" x2="557" y2="264" stroke="#1e293b" stroke-width="2.5"/>
    <!-- Mercedes/Executive Hood Ornament Star -->
    <circle cx="557" cy="216" r="6.5" fill="none" stroke="#f8fafc" stroke-width="1.8"/>
    <path d="M 557 210 L 557 216 M 557 216 L 552 220 M 557 216 L 562 220" stroke="#f8fafc" stroke-width="1.5"/>

    <!-- LED Headlight Unit -->
    <polygon points="480,220 515,223 510,242 475,236" fill="#f8fafc"/>
    <polygon points="485,224 510,226 507,238 482,234" fill="#38bdf8" opacity="0.7"/>

    <!-- Indian HSRP Number Plate (Delhi Commercial DL 1C 8878) -->
    <g transform="translate(528, 268)">
      <rect x="0" y="0" width="60" height="15" rx="2" fill="#ffffff" stroke="#1e293b" stroke-width="1"/>
      <rect x="0" y="0" width="6" height="15" rx="1" fill="#1d4ed8"/>
      <text x="3" y="11" font-size="5" fill="#ffffff" font-weight="900" font-family="monospace">IND</text>
      <text x="10" y="11" font-size="8.5" fill="#0f172a" font-weight="900" font-family="monospace" letter-spacing="0.5">DL 1C 8878</text>
    </g>

    <!-- Rear & Front Chrome Wheels -->
    <g transform="translate(200, 255)">
      <circle cx="28" cy="28" r="28" fill="#090d16"/>
      <circle cx="28" cy="28" r="20" fill="url(#chromeGrille)"/>
      <circle cx="28" cy="28" r="7" fill="#0f172a"/>
    </g>
  </g>

  <!-- ========================================================
       AUTHENTIC INDIAN PROFESSIONAL CHAUFFEUR / DRIVER
  ======================================================== -->
  <g id="indian-driver" transform="translate(190, 75)" filter="url(#cardShadow)">
    <!-- Driver Ambient Ground Shadow -->
    <ellipse cx="140" cy="510" rx="90" ry="16" fill="#0f172a" opacity="0.55"/>

    <!-- Trousers / Legs (Tailored Dark Navy) -->
    <path d="M 98 440 L 90 510 L 132 510 L 136 440 Z" fill="#091020"/>
    <path d="M 144 440 L 148 510 L 190 510 L 182 440 Z" fill="#091020"/>
    <!-- Polished Black Formal Shoes -->
    <path d="M 82 505 Q 110 500 134 505 Q 138 518 126 522 L 80 522 Q 74 513 82 505 Z" fill="#020617"/>
    <path d="M 88 506 Q 105 503 125 507" stroke="#94a3b8" stroke-width="1.2" opacity="0.6"/>
    <path d="M 146 505 Q 170 500 198 505 Q 206 513 198 522 L 144 522 Q 138 518 146 505 Z" fill="#020617"/>
    <path d="M 152 506 Q 175 503 192 507" stroke="#94a3b8" stroke-width="1.2" opacity="0.6"/>

    <!-- Suit Coat / Blazer Body (Tailored Navy Chauffeur Uniform) -->
    <path d="M 75 220 L 60 380 Q 60 445 138 445 Q 216 445 216 380 L 205 220 Z" fill="url(#uniformDark)"/>
    
    <!-- Torso Center Seams & Buttons -->
    <path d="M 138 285 L 138 445" stroke="#091020" stroke-width="2"/>
    <!-- Silver Uniform Buttons -->
    <circle cx="138" cy="330" r="5" fill="#cbd5e1" stroke="#475569" stroke-width="1.2"/>
    <circle cx="138" cy="365" r="5" fill="#cbd5e1" stroke="#475569" stroke-width="1.2"/>
    <circle cx="138" cy="400" r="5" fill="#cbd5e1" stroke="#475569" stroke-width="1.2"/>

    <!-- Crisp White Collared Shirt -->
    <polygon points="120,200 156,200 148,275 128,275" fill="#ffffff"/>
    <!-- Formal Navy Tie -->
    <polygon points="132,215 144,215 148,245 143,325 138,335 133,325 128,245" fill="#0f172a"/>
    <!-- Gold Tie Clip -->
    <rect x="131" y="270" width="15" height="3" rx="1.5" fill="url(#goldAccent)"/>

    <!-- Suit Lapels -->
    <polygon points="100,215 124,285 138,285 112,210" fill="url(#uniformHighlight)"/>
    <polygon points="176,215 152,285 138,285 164,210" fill="url(#uniformHighlight)"/>

    <!-- Epaulettes with Gold Trim (Shoulder Rank Straps) -->
    <polygon points="70,222 108,212 110,218 72,230" fill="#0f192d" stroke="#f59e0b" stroke-width="1.2"/>
    <circle cx="104" cy="215" r="2.5" fill="#fbbf24"/>
    <polygon points="206,222 168,212 166,218 204,230" fill="#0f192d" stroke="#f59e0b" stroke-width="1.2"/>
    <circle cx="172" cy="215" r="2.5" fill="#fbbf24"/>

    <!-- Arms & Clasped Hands (Respectful & Professional Stance) -->
    <!-- Left Arm -->
    <path d="M 68 226 L 45 350 Q 45 385 85 410 L 115 390 L 92 330 L 98 235 Z" fill="url(#uniformDark)"/>
    <!-- Right Arm -->
    <path d="M 208 226 L 231 350 Q 231 385 191 410 L 161 390 L 184 330 L 178 235 Z" fill="url(#uniformDark)"/>
    
    <!-- Hands Clasped in Front (Indian Skin Tone) -->
    <g transform="translate(112, 385)">
      <!-- Wrist watch on left wrist -->
      <rect x="5" y="0" width="16" height="5" rx="1.5" fill="#334155"/>
      <circle cx="13" cy="2.5" r="4" fill="#f8fafc" stroke="#334155" stroke-width="1"/>

      <!-- Left & Right Hands Interlocked -->
      <path d="M 12 5 Q 26 0 40 8 Q 45 22 36 32 Q 22 35 12 28 Q 6 18 12 5 Z" fill="url(#skinTone)"/>
      <path d="M 16 10 Q 28 8 36 15" stroke="url(#skinShadow)" stroke-width="1.5" fill="none"/>
      <path d="M 14 17 Q 26 15 34 22" stroke="url(#skinShadow)" stroke-width="1.5" fill="none"/>
      <path d="M 12 24 Q 24 22 30 28" stroke="url(#skinShadow)" stroke-width="1.5" fill="none"/>
    </g>

    <!-- Neck & Adam's Apple -->
    <path d="M 122 175 L 122 215 Q 138 225 154 215 L 154 175 Z" fill="url(#skinTone)"/>
    <path d="M 124 195 Q 138 208 152 195" fill="url(#skinShadow)" opacity="0.6"/>

    <!-- Head & Indian Facial Features -->
    <path d="M 104 125 Q 102 188 138 190 Q 174 188 172 125 Q 172 85 138 85 Q 104 85 104 125 Z" fill="url(#skinTone)"/>
    <!-- Jawline & Chin Structure -->
    <path d="M 112 145 Q 138 188 164 145" fill="none" stroke="url(#skinShadow)" stroke-width="1.5" opacity="0.35"/>

    <!-- Ears -->
    <path d="M 102 126 Q 95 138 103 150 Z" fill="url(#skinTone)"/>
    <path d="M 174 126 Q 181 138 173 150 Z" fill="url(#skinTone)"/>

    <!-- Expressive Eyes & Eyebrows (Warm & Trustworthy Indian Eyes) -->
    <!-- Left Eyebrow -->
    <path d="M 114 120 Q 124 116 132 120" stroke="#1e293b" stroke-width="3" stroke-linecap="round" fill="none"/>
    <!-- Left Eye -->
    <ellipse cx="123" cy="128" rx="6.5" ry="4" fill="#ffffff"/>
    <circle cx="123.5" cy="128" r="3.2" fill="#2d1c10"/>
    <circle cx="124.5" cy="127" r="1" fill="#ffffff"/>

    <!-- Right Eyebrow -->
    <path d="M 144 120 Q 152 116 162 120" stroke="#1e293b" stroke-width="3" stroke-linecap="round" fill="none"/>
    <!-- Right Eye -->
    <ellipse cx="153" cy="128" rx="6.5" ry="4" fill="#ffffff"/>
    <circle cx="152.5" cy="128" r="3.2" fill="#2d1c10"/>
    <circle cx="153.5" cy="127" r="1" fill="#ffffff"/>

    <!-- Straight Well-Defined Nose -->
    <path d="M 138 124 L 136 145 Q 138 149 142 147" stroke="url(#skinShadow)" stroke-width="2" fill="none" stroke-linecap="round"/>
    <circle cx="133" cy="147" r="1.5" fill="url(#skinShadow)"/>
    <circle cx="143" cy="147" r="1.5" fill="url(#skinShadow)"/>

    <!-- Genuine, Welcoming Polite Smile -->
    <path d="M 124 158 Q 138 172 152 158" stroke="#7e4a23" stroke-width="2" fill="#ffffff" stroke-linecap="round"/>
    <path d="M 124 158 Q 138 163 152 158" stroke="#7e4a23" stroke-width="1.5" fill="none"/>

    <!-- Well-Groomed Trim Mustache (Distinguished Indian Driver Look) -->
    <path d="M 126 154 Q 138 152 150 154 Q 146 157 138 156 Q 130 157 126 154 Z" fill="#1e293b" opacity="0.85"/>

    <!-- ========================================================
         OFFICIAL DRIVER PEAKED CAP WITH EMBLEM
    ======================================================== -->
    <!-- Cap Crown (Dark Navy) -->
    <path d="M 92 108 Q 90 60 138 56 Q 186 60 184 108 Q 138 98 92 108 Z" fill="url(#uniformDark)"/>
    <!-- Gold Embroidered Cap Band -->
    <path d="M 93 104 Q 138 95 183 104 L 183 113 Q 138 104 93 113 Z" fill="url(#goldAccent)"/>
    <path d="M 94 108 Q 138 100 182 108" stroke="#78350f" stroke-width="1" stroke-dasharray="2,2"/>
    
    <!-- Polished Black Patent Visor / Peak -->
    <path d="M 94 113 Q 138 126 182 113 Q 188 122 176 128 Q 138 136 100 128 Q 88 122 94 113 Z" fill="#020617"/>
    <!-- Visor Specular Reflection -->
    <path d="M 108 121 Q 138 129 168 121" stroke="#ffffff" stroke-width="1.8" fill="none" opacity="0.6"/>

    <!-- Golden Metallic Crest / Emblem Badge on Cap -->
    <g transform="translate(138, 88)">
      <!-- Circular Gold Shield -->
      <circle cx="0" cy="0" r="10.5" fill="url(#goldAccent)" stroke="#ffffff" stroke-width="1"/>
      <circle cx="0" cy="0" r="8" fill="#0f192d"/>
      <!-- Ashoka Chakra / Steering Wheel Icon in Badge -->
      <circle cx="0" cy="0" r="5" fill="none" stroke="#fbbf24" stroke-width="1.2"/>
      <circle cx="0" cy="0" r="1.5" fill="#fbbf24"/>
      <line x1="0" y1="-5" x2="0" y2="5" stroke="#fbbf24" stroke-width="1"/>
      <line x1="-5" y1="0" x2="5" y2="0" stroke="#fbbf24" stroke-width="1"/>
    </g>
  </g>

  <!-- ========================================================
       FLOATING TRUST & VERIFICATION PILL (Securitas Style)
  ======================================================== -->
  <g transform="translate(480, 50)" filter="url(#badgeShadow)">
    <!-- Pill Container -->
    <rect x="0" y="0" width="280" height="74" rx="20" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/>
    
    <!-- Green Shield Icon -->
    <g transform="translate(18, 17)">
      <circle cx="20" cy="20" r="20" fill="url(#badgeGlow)"/>
      <path d="M 20 8 L 29 12 V 20 C 29 26 25 30 20 32 C 15 30 11 26 11 20 V 12 Z" fill="#ffffff"/>
      <polyline points="16,20 19,23 25,17" fill="none" stroke="#059669" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
    </g>

    <!-- Badge Typography -->
    <text x="68" y="32" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="13" font-weight="800" fill="#0f172a">
      VERIFIED CHAUFFEUR
    </text>
    <text x="68" y="49" font-family="system-ui, sans-serif" font-size="11" font-weight="600" fill="#059669">
      ✓ Sarathi RTO &amp; Police Clear
    </text>
  </g>

  <!-- Secondary Trust Stat Capsule -->
  <g transform="translate(40, 520)" filter="url(#badgeShadow)">
    <rect x="0" y="0" width="220" height="50" rx="14" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/>
    <text x="16" y="24" font-family="system-ui, sans-serif" font-size="12" font-weight="800" fill="#0f172a">
      DL AUTHENTICATED
    </text>
    <text x="16" y="40" font-family="system-ui, sans-serif" font-size="10.5" font-weight="600" fill="#64748b">
      Commercial Badge • Zero Criminal Record
    </text>
  </g>
</svg>
