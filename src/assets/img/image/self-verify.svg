<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 450" width="100%" height="100%">
  <defs>
    <!-- Background Atmospheric Gradients -->
    <linearGradient id="deepSpace" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e0b36" />
      <stop offset="40%" stop-color="#120722" />
      <stop offset="100%" stop-color="#080310" />
    </linearGradient>

    <radialGradient id="amethystGlow" cx="50%" cy="40%" r="55%">
      <stop offset="0%" stop-color="#9333ea" stop-opacity="0.38" />
      <stop offset="50%" stop-color="#7c3aed" stop-opacity="0.14" />
      <stop offset="100%" stop-color="#080310" stop-opacity="0" />
    </radialGradient>

    <radialGradient id="cyanAccent" cx="80%" cy="25%" r="40%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.28" />
      <stop offset="100%" stop-color="#06b6d4" stop-opacity="0" />
    </radialGradient>

    <radialGradient id="emeraldAura" cx="20%" cy="75%" r="45%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#10b981" stop-opacity="0" />
    </radialGradient>

    <!-- Face & Body Gradients -->
    <linearGradient id="skinGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fcd34d" />
      <stop offset="60%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>

    <linearGradient id="suitGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#312e81" />
      <stop offset="50%" stop-color="#1e1b4b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>

    <linearGradient id="collarGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#cbd5e1" />
    </linearGradient>

    <!-- Holographic Card Gradient -->
    <linearGradient id="holoCard" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="rgba(255, 255, 255, 0.22)" />
      <stop offset="50%" stop-color="rgba(192, 132, 252, 0.12)" />
      <stop offset="100%" stop-color="rgba(56, 189, 248, 0.20)" />
    </linearGradient>

    <!-- Gold & Green Shield Gradients -->
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#047857" />
    </linearGradient>

    <linearGradient id="purpleNeon" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#c084fc" />
      <stop offset="50%" stop-color="#a855f7" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>

    <!-- Soft Glow Filter -->
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <filter id="dropShadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#000000" flood-opacity="0.55" />
    </filter>
  </defs>

  <!-- Deep Canvas -->
  <rect width="600" height="450" fill="url(#deepSpace)" />
  <rect width="600" height="450" fill="url(#amethystGlow)" />
  <rect width="600" height="450" fill="url(#cyanAccent)" />
  <rect width="600" height="450" fill="url(#emeraldAura)" />

  <!-- Background Tech Grid Lines & Geometric Halo -->
  <g opacity="0.18" stroke="#a855f7" stroke-width="1">
    <circle cx="300" cy="220" r="190" fill="none" stroke-dasharray="4 8" />
    <circle cx="300" cy="220" r="145" fill="none" />
    <circle cx="300" cy="220" r="105" fill="none" stroke-dasharray="2 6" />
    <line x1="80" y1="220" x2="520" y2="220" stroke-dasharray="6 10" />
    <line x1="300" y1="30" x2="300" y2="410" stroke-dasharray="6 10" />
  </g>

  <!-- HUD Corner Reticles -->
  <g stroke="#c084fc" stroke-width="2" opacity="0.65" fill="none">
    <path d="M 40 55 L 40 40 L 55 40" />
    <path d="M 545 40 L 560 40 L 560 55" />
    <path d="M 40 395 L 40 410 L 55 410" />
    <path d="M 545 410 L 560 410 L 560 395" />
  </g>

  <!-- Ambient Light Orbs -->
  <circle cx="110" cy="110" r="3" fill="#38bdf8" opacity="0.8" />
  <circle cx="490" cy="140" r="4" fill="#a855f7" opacity="0.8" />
  <circle cx="510" cy="320" r="3" fill="#10b981" opacity="0.8" />
  <circle cx="90" cy="330" r="3.5" fill="#c084fc" opacity="0.7" />

  <!-- ========================================================
       CENTRAL SUBJECT: Confident Professional Individual
       ======================================================== -->
  <g transform="translate(190, 80)" filter="url(#dropShadow)">
    <!-- Back Glow behind Head -->
    <ellipse cx="110" cy="130" rx="90" ry="110" fill="#7c3aed" opacity="0.25" filter="url(#neonGlow)" />

    <!-- Shoulders & Blazer -->
    <path
      d="M 10 320 
         C 10 240, 50 190, 110 190 
         C 170 190, 210 240, 210 320 
         Z"
      fill="url(#suitGrad)"
      stroke="rgba(192, 132, 252, 0.3)"
      stroke-width="1.5"
    />

    <!-- Blazer Lapels & Inner Shirt -->
    <polygon points="110,210 88,270 110,320 132,270" fill="url(#collarGrad)" />
    <polygon points="110,240 102,320 118,320" fill="#3b82f6" />
    <!-- Lapels -->
    <path d="M 85 200 L 95 270 L 60 250 Z" fill="#1e1b4b" opacity="0.9" />
    <path d="M 135 200 L 125 270 L 160 250 Z" fill="#1e1b4b" opacity="0.9" />

    <!-- Neck -->
    <rect x="95" y="145" width="30" height="45" rx="6" fill="#d97706" />

    <!-- Head & Face -->
    <ellipse cx="110" cy="115" rx="44" ry="52" fill="url(#skinGrad)" />

    <!-- Sleek Modern Hair -->
    <path
      d="M 66 110 
         C 63 60, 90 40, 120 40 
         C 148 40, 162 60, 154 110 
         C 146 72, 134 62, 110 62 
         C 88 62, 74 76, 66 110 Z"
      fill="#0f172a"
    />
    <!-- Side hair / ears -->
    <ellipse cx="66" cy="118" rx="8" ry="12" fill="#d97706" />
    <ellipse cx="154" cy="118" rx="8" ry="12" fill="#d97706" />

    <!-- Friendly Modern Face Details -->
    <!-- Eyebrows -->
    <path d="M 82 96 Q 94 92 102 96" stroke="#0f172a" stroke-width="3" stroke-linecap="round" fill="none" />
    <path d="M 118 96 Q 126 92 138 96" stroke="#0f172a" stroke-width="3" stroke-linecap="round" fill="none" />
    <!-- Eyes -->
    <ellipse cx="92" cy="108" rx="4.5" ry="5.5" fill="#0f172a" />
    <ellipse cx="128" cy="108" rx="4.5" ry="5.5" fill="#0f172a" />
    <circle cx="94" cy="106" r="1.5" fill="#ffffff" />
    <circle cx="130" cy="106" r="1.5" fill="#ffffff" />
    <!-- Nose -->
    <path d="M 110 108 L 108 124 L 114 124" stroke="#b45309" stroke-width="2" stroke-linecap="round" fill="none" />
    <!-- Confident Smile -->
    <path d="M 98 138 Q 110 148 122 138" stroke="#78350f" stroke-width="2.5" stroke-linecap="round" fill="none" />

    <!-- Biometric Face Scan Target Ring -->
    <circle cx="110" cy="115" r="62" fill="none" stroke="url(#purpleNeon)" stroke-width="1.8" stroke-dasharray="8 12" opacity="0.85" />
    <path d="M 75 75 L 85 75" stroke="#38bdf8" stroke-width="2" stroke-linecap="round" />
    <path d="M 75 75 L 75 85" stroke="#38bdf8" stroke-width="2" stroke-linecap="round" />
    <path d="M 145 75 L 135 75" stroke="#38bdf8" stroke-width="2" stroke-linecap="round" />
    <path d="M 145 75 L 145 85" stroke="#38bdf8" stroke-width="2" stroke-linecap="round" />
    <path d="M 75 155 L 85 155" stroke="#38bdf8" stroke-width="2" stroke-linecap="round" />
    <path d="M 75 155 L 75 145" stroke="#38bdf8" stroke-width="2" stroke-linecap="round" />
    <path d="M 145 155 L 135 155" stroke="#38bdf8" stroke-width="2" stroke-linecap="round" />
    <path d="M 145 155 L 145 145" stroke="#38bdf8" stroke-width="2" stroke-linecap="round" />
  </g>

  <!-- ========================================================
       FLOATING HOLOGRAPHIC ID CARD DOSSIER (Left Foreground)
       ======================================================== -->
  <g transform="translate(60, 230)" filter="url(#dropShadow)">
    <!-- Glass ID Container -->
    <rect
      x="0"
      y="0"
      width="190"
      height="125"
      rx="18"
      fill="url(#holoCard)"
      stroke="rgba(255, 255, 255, 0.4)"
      stroke-width="1.5"
    />
    <rect
      x="0"
      y="0"
      width="190"
      height="125"
      rx="18"
      fill="none"
      stroke="url(#purpleNeon)"
      stroke-width="1.2"
      opacity="0.6"
    />

    <!-- Header Pill inside Card -->
    <rect x="14" y="14" width="70" height="18" rx="9" fill="rgba(16, 185, 129, 0.2)" stroke="#10b981" stroke-width="1" />
    <circle cx="23" cy="23" r="3.5" fill="#34d399" />
    <text x="32" y="27" font-family="system-ui, sans-serif" font-size="9" font-weight="700" fill="#34d399">GOVT ID</text>

    <!-- Mini Avatar Graphic -->
    <rect x="14" y="42" width="38" height="46" rx="8" fill="#1e1b4b" stroke="rgba(168, 85, 247, 0.4)" stroke-width="1" />
    <circle cx="33" cy="58" r="9" fill="#c084fc" opacity="0.9" />
    <path d="M 21 82 C 21 72, 45 72, 45 82 Z" fill="#a855f7" />

    <!-- Name & Status Lines -->
    <rect x="62" y="46" width="75" height="7" rx="3.5" fill="#ffffff" opacity="0.9" />
    <rect x="62" y="58" width="55" height="5" rx="2.5" fill="#c084fc" opacity="0.7" />
    <rect x="62" y="68" width="85" height="4" rx="2" fill="rgba(255, 255, 255, 0.4)" />

    <!-- Tamper Proof Badge -->
    <g transform="translate(14, 96)">
      <circle cx="6" cy="6" r="6" fill="#10b981" />
      <path d="M 3.5 6 L 5.5 8 L 8.5 4" stroke="#ffffff" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" fill="none" />
      <text x="17" y="9.5" font-family="system-ui, sans-serif" font-size="8.5" font-weight="700" fill="#ffffff" letter-spacing="0.4">100% VERIFIED</text>
    </g>

    <!-- QR Code Graphic on Right -->
    <rect x="142" y="70" width="34" height="34" rx="6" fill="#ffffff" />
    <!-- QR modules -->
    <rect x="146" y="74" width="9" height="9" fill="#0f172a" />
    <rect x="148" y="76" width="5" height="5" fill="#ffffff" />
    <rect x="163" y="74" width="9" height="9" fill="#0f172a" />
    <rect x="165" y="76" width="5" height="5" fill="#ffffff" />
    <rect x="146" y="91" width="9" height="9" fill="#0f172a" />
    <rect x="148" y="93" width="5" height="5" fill="#ffffff" />
    <rect x="160" y="87" width="4" height="4" fill="#0f172a" />
    <rect x="167" y="94" width="5" height="5" fill="#10b981" />
  </g>

  <!-- ========================================================
       EMERALD SECURITY SHIELD BADGE (Right Floating)
       ======================================================== -->
  <g transform="translate(425, 200)" filter="url(#dropShadow)">
    <!-- Outer Radiant Halo -->
    <circle cx="45" cy="45" r="45" fill="#10b981" opacity="0.18" filter="url(#neonGlow)" />

    <!-- Shield Plate -->
    <path
      d="M 45 10 
         L 80 24 
         C 80 58, 62 82, 45 92 
         C 28 82, 10 58, 10 24 
         Z"
      fill="url(#shieldGrad)"
      stroke="rgba(255, 255, 255, 0.4)"
      stroke-width="2"
    />

    <!-- Shield Inner Bevel -->
    <path
      d="M 45 16 
         L 73 28 
         C 73 54, 58 74, 45 83 
         C 32 74, 17 54, 17 28 
         Z"
      fill="none"
      stroke="#34d399"
      stroke-width="1.2"
      opacity="0.6"
    />

    <!-- Large White Checkmark -->
    <path
      d="M 32 46 L 42 56 L 60 36"
      stroke="#ffffff"
      stroke-width="5"
      stroke-linecap="round"
      stroke-linejoin="round"
      fill="none"
    />

    <!-- Small Floating Capsule "CERTIFIED" -->
    <g transform="translate(5, 104)">
      <rect x="0" y="0" width="80" height="22" rx="11" fill="#0f172a" stroke="#10b981" stroke-width="1.2" />
      <circle cx="12" cy="11" r="3.5" fill="#34d399" />
      <text x="21" y="15" font-family="system-ui, sans-serif" font-size="8.5" font-weight="800" fill="#ffffff" letter-spacing="0.5">ISO 27001</text>
    </g>
  </g>

  <!-- Glowing Scanning Light Ray -->
  <line x1="160" y1="210" x2="440" y2="210" stroke="#38bdf8" stroke-width="1.5" opacity="0.6" filter="url(#neonGlow)" stroke-dasharray="6 6" />
  <circle cx="440" cy="210" r="4" fill="#38bdf8" filter="url(#neonGlow)" />
</svg>
